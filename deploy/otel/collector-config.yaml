receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  attributes/sanitize:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.set-cookie
        action: delete
      - key: http.request.header.proxy-authorization
        action: delete
      - key: http.request.header.x-api-key
        action: delete
      - key: http.request.header.x-auth-token
        action: delete
      - key: url.full
        action: delete
      - key: url.query
        action: delete
      - key: db.statement
        action: delete
      - key: db.query.text
        action: delete
      - key: db.sql.table
        action: delete
      - key: db.operation.parameter
        action: delete
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sanitize, batch]
      exporters: [otlp_grpc/tempo]
