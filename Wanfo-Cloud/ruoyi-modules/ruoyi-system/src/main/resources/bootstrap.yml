# Tomcat
server:
  port: 9201

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
monitor:
  actuator:
    username: ${WANFO_ACTUATOR_USERNAME:}
    password: ${WANFO_ACTUATOR_PASSWORD:}

# Spring
spring: 
  application:
    # 应用名称
    name: ruoyi-system
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
        ip: 127.0.0.1
        metadata:
          user.name: ${WANFO_ACTUATOR_USERNAME:}
          user.password: ${WANFO_ACTUATOR_PASSWORD:}
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
  config:
    # 配置文件格式
    file-extension: yml
    import:
      - optional:nacos:application-${spring.profiles.active}.${spring.config.file-extension}
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.config.file-extension}
