name: wanfo-tracing

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    depends_on:
      - tempo
    restart: unless-stopped
    mem_limit: 160m

  tempo:
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    expose:
      - "3200"
      - "4317"
      - "4318"
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped
    mem_limit: 320m

  grafana:
    image: grafana/grafana:12.4.13
    environment:
      GF_SECURITY_ADMIN_USER: ${WANFO_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${WANFO_GRAFANA_ADMIN_PASSWORD:?Set WANFO_GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - tempo
    restart: unless-stopped
    mem_limit: 320m

volumes:
  tempo-data:
  grafana-data:
