name: wanfo-bi-database-acceptance

# Local connector acceptance only. Ports bind to loopback and data uses dedicated
# named volumes; do not expose these instances to a network or reuse in production.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${WANFO_SQLSERVER_SA_PASSWORD:?Set WANFO_SQLSERVER_SA_PASSWORD in deploy/.env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:11433:1433"
    mem_limit: 3g
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 90s

  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${WANFO_ORACLE_ADMIN_PASSWORD:?Set WANFO_ORACLE_ADMIN_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:11521:1521"
    mem_limit: 3g
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 8s
      retries: 40
      start_period: 120s

volumes:
  sqlserver-data:
  oracle-data:
